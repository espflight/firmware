name: Firmware CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ARDUINO_CLI_LINUX_X64_SHA256: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"
  ESPASYNC_TCP_COMMIT: "6aa552d9910515be08af4bda70a29714ddca3025"
  ESPASYNC_WEBSERVER_COMMIT: "c1888926ed8595f14f4971e9e1538b43ea63aa59"

jobs:
  compile:
    name: Compile ESPFlight Firmware v1.0.0 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Arduino CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          bin_dir="$RUNNER_TEMP/arduino-cli-bin"

          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"

          echo "${ARDUINO_CLI_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -

          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" arduino-cli
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify Arduino CLI version
        shell: bash
        run: |
          arduino-cli version
          arduino-cli version | grep -E 'Version: 1\.5\.1([[:space:]]|$)'

      - name: Configure ESP8266 package index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index

      - name: Install pinned ESP8266 core
        run: arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install pinned Library Manager dependencies
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson@6.21.6"
          arduino-cli lib install "Adafruit_VL53L0X@1.2.5"

      - name: Install commit-pinned ESP32Async libraries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arduino-libraries"

          git init "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP"
          git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP" remote add origin https://github.com/ESP32Async/ESPAsyncTCP.git
          git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP" fetch --depth 1 origin "$ESPASYNC_TCP_COMMIT"
          git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP" checkout --detach FETCH_HEAD

          git init "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer"
          git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer" remote add origin https://github.com/ESP32Async/ESPAsyncWebServer.git
          git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer" fetch --depth 1 origin "$ESPASYNC_WEBSERVER_COMMIT"
          git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer" checkout --detach FETCH_HEAD

      - name: Verify pinned async library revisions
        shell: bash
        run: |
          test "$(git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP" rev-parse HEAD)" = "$ESPASYNC_TCP_COMMIT"
          test "$(git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer" rev-parse HEAD)" = "$ESPASYNC_WEBSERVER_COMMIT"

      - name: Verify release identity
        run: |
          grep -F '#define ESPFLIGHT_FIRMWARE_VERSION "1.0.0"' config.h
          grep -F '#define ESPFLIGHT_PROTOCOL_VERSION 2U' config.h
          grep -F '#define ESPFLIGHT_CPU_FREQUENCY_MHZ 160U' config.h
          grep -F '#define ESPFLIGHT_MOTOR_PWM_FREQUENCY 4000U' config.h
          grep -F '#define ESPFLIGHT_CONTROL_LOOP_US 4000UL' config.h

      - name: Prepare Arduino sketch directory
        run: |
          mkdir -p "$RUNNER_TEMP/espflight"
          cp ./*.ino ./*.cpp ./*.h "$RUNNER_TEMP/espflight/"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:d1_mini \
            --libraries "$RUNNER_TEMP/arduino-libraries" \
            "$RUNNER_TEMP/espflight"
