name: Firmware CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ESPFlight Firmware v1.0.0 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: "1.x"

      - name: Configure ESP8266 package index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index

      - name: Install pinned ESP8266 core
        run: arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install pinned Library Manager dependencies
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson@6.21.6"
          arduino-cli lib install "Adafruit VL53L0X@1.2.5"

      - name: Install pinned ESP32Async libraries
        run: |
          mkdir -p "$RUNNER_TEMP/arduino-libraries"
          git clone --depth 1 --branch v2.0.0 https://github.com/ESP32Async/ESPAsyncTCP.git "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP"
          git clone --depth 1 --branch v3.6.0 https://github.com/ESP32Async/ESPAsyncWebServer.git "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer"

      - name: Verify pinned async library revisions
        run: |
          test "$(git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncTCP" describe --tags --exact-match)" = "v2.0.0"
          test "$(git -C "$RUNNER_TEMP/arduino-libraries/ESPAsyncWebServer" describe --tags --exact-match)" = "v3.6.0"

      - name: Verify release identity
        run: |
          grep -F '#define ESPFLIGHT_FIRMWARE_VERSION "1.0.0"' config.h
          grep -F '#define ESPFLIGHT_PROTOCOL_VERSION 2U' config.h
          grep -F '#define ESPFLIGHT_CPU_FREQUENCY_MHZ 160U' config.h
          grep -F '#define ESPFLIGHT_MOTOR_PWM_FREQUENCY 4000U' config.h
          grep -F '#define ESPFLIGHT_CONTROL_LOOP_US 4000UL' config.h

      - name: Prepare Arduino sketch directory
        run: |
          mkdir -p "$RUNNER_TEMP/espflight"
          cp ./*.ino ./*.cpp ./*.h "$RUNNER_TEMP/espflight/"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:d1_mini \
            --libraries "$RUNNER_TEMP/arduino-libraries" \
            "$RUNNER_TEMP/espflight"
